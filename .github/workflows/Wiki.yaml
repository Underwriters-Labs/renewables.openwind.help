name: Build and Deploy Wiki

on:
  gollum:  # Triggered when wiki is updated
  workflow_dispatch:  # Manual trigger option

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python 3.13.9
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.9'

      # Step 3: Set up Hugo
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'
          extended: false

      # Step 4: Download Wiki content from GitHub Wiki
      - name: Clone Wiki content
        run: |
          git clone https://github.com/${{ github.repository }}.wiki.git wiki-temp
          mkdir -p website/content
          cp -r wiki-temp/* website/content/ || true
          rm -rf wiki-temp

      # Step 5: Run the orchestration script with backup
      - name: Process content with orchestration script
        run: |
          cd ${{ github.workspace }}
          python website/tools/run_all_tools.py --base website --backup

      # Step 6: Build Hugo site
      - name: Build Hugo site
        run: |
          cd website
          hugo --minify --cleanDestinationDir

      # Step 7: Deploy to SSH machine
      - name: Deploy to SSH server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: 'website/public/*'
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 2

      # Step 8: Optional - Clear cache or restart services on remote
      - name: Run post-deployment commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            # Add any post-deployment commands here
            # Examples:
            # - restart service
            # - clear cache
            # - update permissions
            echo "Deployment completed successfully"